[project]
name = "agentic-crew"
version = "0.1.0"
description = "A file-based agent crew: a LangGraph orchestrator that routes work to specialised agents, each with its own RAG store."
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = { text = "AGPL-3.0" }

dependencies = [
    "conduit-ai-gateway",
    "langchain-core>=0.3",
    "langchain-community>=0.3",
    "langchain-text-splitters>=0.3",
    "langchain-qdrant>=0.2",
    "langchain-openai>=0.3",
    "qdrant-client>=1.12",
    "langgraph>=0.2",
    "fastembed>=0.4",
    "pypdf>=5.0",
    "pyyaml>=6.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "httpx>=0.27"]

[project.scripts]
agentic-crew = "agentic_crew.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_crew"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
